
<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f2f2f2;
            text-align: center;
        }
        header {
            background: purple;
            color: white;
            padding: 20px;
        }
        nav {
            background: #333;
            padding: 12px;
        }
        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 25px;
        }
        .item {
            background: white;
            padding: 15px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 0 8px gray;
        }
        .item img {
            width: 150px;
            height: 130px;
            object-fit: contain;
        }
        button {
            background: purple;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        footer {
            background: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Online Store</h1>
    <p>Welcome to our Shopping Website!</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
</nav>

<h2 id="home">Our Products</h2>

<div class="products" id="products">

    <div class="item">
        <img src="https://placehold.co/150x130?text=Shoes"
             alt="Shoes">
        <h3>Shoes</h3>
        <p>Price: ₹999</p>
        <button onclick="addToCart('Shoes')">Add to Cart</button>
    </div>

    <div class="item">
        <img src="https://placehold.co/150x130?text=Watch"
             alt="Watch">
        <h3>Watch</h3>
        <p>Price: ₹799</p>
        <button onclick="addToCart('Watch')">Add to Cart</button>
    </div>

    <div class="item">
        <img src="https://placehold.co/150x130?text=Bag"
             alt="Bag">
        <h3>School Bag</h3>
        <p>Price: ₹599</p>
        <button onclick="addToCart('School Bag')">Add to Cart</button>
    </div>

    <div class="item">
        <img src="https://placehold.co/150x130?text=Headphones"
             alt="Headphones">
        <h3>Headphones</h3>
        <p>Price: ₹499</p>
        <button onclick="addToCart('Headphones')">Add to Cart</button>
    </div>

</div>

<h2 id="cart">Shopping Cart</h2>
<p id="message">Your cart is empty.</p>

<script>
    let cart = [];

    function addToCart(product) {
        cart.push(product);
        document.getElementById("message").innerHTML =
            "Items in cart: " + cart.join(", ");
    }
</script>

<footer id="contact">
    <p>Contact: myshop@example.com</p>
    <p>Thank you for visiting My Online Store!</p>
</footer>

</body>
</html>
